<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} — Rémy Crespel</title>

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap (grille, utilitaires, formulaires) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Thème custom, chargé après Bootstrap pour prendre le dessus -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <a href="/">accueil</a>
    <a href="/formations">formations</a>
    <a href="/experiences">expériences</a>
    <a href="/projects">projets</a>
    <a href="/competences">compétences</a>
    <a href="/contact">contact</a>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>© Rémy Crespel — remy.cspl@gmail.com</p>
</footer>

</body>
</html>
